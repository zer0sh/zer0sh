<svg xmlns="http://www.w3.org/2000/svg" width="690" height="180" viewBox="0 0 690 180" fill="none" role="img" aria-label="Personal vs Job Breakdown">
  <title>Breakdown: Personal vs Job Activity</title>
  <defs>
    <style>
      .font-m3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card-title { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
      .row-lbl { font-weight: 500; font-size: 12px; fill: #8e9196; }
      .row-val { font-weight: 700; font-size: 13px; fill: #e2e2e5; text-anchor: end; }
    </style>
  </defs>

  <rect x="1" y="1" width="688" height="178" rx="20" fill="#131316" stroke="#2d3036" stroke-width="1.2"/>

  <!-- Columna Izquierda: PERSONAL (This Account - 310px) -->
  <g transform="translate(24, 20)">
    <rect width="310" height="140" rx="14" fill="#181c24" stroke="#263142" stroke-width="1"/>
    
    <!-- Title -->
    <circle cx="20" cy="22" r="5" fill="#58a6ff" />
    <text x="34" y="26" class="font-m3 card-title" fill="#58a6ff">Personal (This Account)</text>

    <!-- Stats Rows -->
    <g transform="translate(20, 52)">
      <text y="0" class="font-m3 row-lbl">Total Contributions</text>
      <text x="270" y="0" class="font-m3 row-val">358</text>

      <text y="24" class="font-m3 row-lbl">Commits (Public)</text>
      <text x="270" y="24" class="font-m3 row-val">343</text>

      <text y="48" class="font-m3 row-lbl">PRs and Issues</text>
      <text x="270" y="48" class="font-m3 row-val">3 PRs / 12 Issues</text>

      <text y="72" class="font-m3 row-lbl">Active Projects</text>
      <text x="270" y="72" class="font-m3 row-val">32 Repos</text>
    </g>
  </g>

  <!-- Columna Derecha: JOB (Secret & Enterprise - 310px) -->
  <g transform="translate(356, 20)">
    <rect width="310" height="140" rx="14" fill="#24191a" stroke="#482729" stroke-width="1"/>
    
    <!-- Title -->
    <circle cx="20" cy="22" r="5" fill="#f2b8b5" />
    <text x="34" y="26" class="font-m3 card-title" fill="#f2b8b5">Job (Secret Enterprise)</text>

    <!-- Stats Rows -->
    <g transform="translate(20, 52)">
      <text y="0" class="font-m3 row-lbl">Total Contributions</text>
      <text x="270" y="0" class="font-m3 row-val" fill="#f2b8b5">3,430+</text>

      <text y="24" class="font-m3 row-lbl">Production Commits</text>
      <text x="270" y="24" class="font-m3 row-val">2,740+</text>

      <text y="48" class="font-m3 row-lbl">PRs and Issues</text>
      <text x="270" y="48" class="font-m3 row-val">688 PRs / 2 Issues</text>

      <text y="72" class="font-m3 row-lbl">Impacted Enterprise Repos</text>
      <text x="270" y="72" class="font-m3 row-val">67 Projects</text>
    </g>
  </g>
</svg>