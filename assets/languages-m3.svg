<svg xmlns="http://www.w3.org/2000/svg" width="690" height="230" viewBox="0 0 690 230" fill="none" role="img" aria-label="Most Used Languages: Personal vs Job">
  <title>Most Used Languages: Personal vs Job</title>
  <defs>
    <style>
      .font-m3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; font-size: 14px; letter-spacing: 0.2px; }
      .lang-name { font-weight: 600; font-size: 12px; fill: #e2e2e5; }
      .lang-pct { font-weight: 700; font-size: 11px; fill: #8e9196; text-anchor: end; }
    </style>
  </defs>

  <rect x="1" y="1" width="688" height="228" rx="20" fill="#131316" stroke="#2d3036" stroke-width="1.2"/>

  <!-- Columna 1: Personal Languages (310px) -->
  <g transform="translate(24, 20)">
    <rect width="310" height="190" rx="14" fill="#181c24" stroke="#263142" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#58a6ff" />
    <text x="34" y="26" class="font-m3 title" fill="#58a6ff">Personal Stack (zer0sh)</text>

    <g transform="translate(20, 48)">
      
            <g transform="translate(0, 0)">
              <text y="10" class="font-m3 lang-name">QML</text>
              <text x="270" y="10" class="font-m3 lang-pct">22.5%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="42" height="5" rx="2.5" fill="#58a6ff"/>
            </g>
            
            <g transform="translate(0, 28)">
              <text y="10" class="font-m3 lang-name">PHP</text>
              <text x="270" y="10" class="font-m3 lang-pct">20.4%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="38" height="5" rx="2.5" fill="#58a6ff"/>
            </g>
            
            <g transform="translate(0, 56)">
              <text y="10" class="font-m3 lang-name">HTML</text>
              <text x="270" y="10" class="font-m3 lang-pct">7.9%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="15" height="5" rx="2.5" fill="#58a6ff"/>
            </g>
            
            <g transform="translate(0, 84)">
              <text y="10" class="font-m3 lang-name">Python</text>
              <text x="270" y="10" class="font-m3 lang-pct">7.9%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="15" height="5" rx="2.5" fill="#58a6ff"/>
            </g>
            
            <g transform="translate(0, 112)">
              <text y="10" class="font-m3 lang-name">JavaScript</text>
              <text x="270" y="10" class="font-m3 lang-pct">7.3%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="13" height="5" rx="2.5" fill="#58a6ff"/>
            </g>
            
    </g>
  </g>

  <!-- Columna 2: Job Languages (310px) -->
  <g transform="translate(356, 20)">
    <rect width="310" height="190" rx="14" fill="#24191a" stroke="#482729" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#f2b8b5" />
    <text x="34" y="26" class="font-m3 title" fill="#f2b8b5">Production Stack (Job)</text>

    <g transform="translate(20, 48)">
      
            <g transform="translate(0, 0)">
              <text y="10" class="font-m3 lang-name">PHP</text>
              <text x="270" y="10" class="font-m3 lang-pct">70.8%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="134" height="5" rx="2.5" fill="#f2b8b5"/>
            </g>
            
            <g transform="translate(0, 28)">
              <text y="10" class="font-m3 lang-name">JavaScript</text>
              <text x="270" y="10" class="font-m3 lang-pct">18.0%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="34" height="5" rx="2.5" fill="#f2b8b5"/>
            </g>
            
            <g transform="translate(0, 56)">
              <text y="10" class="font-m3 lang-name">CSS</text>
              <text x="270" y="10" class="font-m3 lang-pct">9.5%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="18" height="5" rx="2.5" fill="#f2b8b5"/>
            </g>
            
            <g transform="translate(0, 84)">
              <text y="10" class="font-m3 lang-name">Python</text>
              <text x="270" y="10" class="font-m3 lang-pct">0.9%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="1" height="5" rx="2.5" fill="#f2b8b5"/>
            </g>
            
            <g transform="translate(0, 112)">
              <text y="10" class="font-m3 lang-name">HTML</text>
              <text x="270" y="10" class="font-m3 lang-pct">0.6%</text>
              <rect y="16" width="270" height="5" rx="2.5" fill="#2d3036"/>
              <rect y="16" width="1" height="5" rx="2.5" fill="#f2b8b5"/>
            </g>
            
    </g>
  </g>
</svg>