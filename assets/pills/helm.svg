<svg xmlns="http://www.w3.org/2000/svg" width="68" height="32" viewBox="0 0 68 32" fill="none" role="img" aria-label="Helm">
  <title>Helm</title>
  <defs>
    <style>
      .pill-bg {
        fill: #131316;
        stroke: #1f6feb;
        stroke-width: 1.3;
        transition: all 0.2s ease;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e2e5;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Material You Pill: rx="16" para redondeo total + Borde Azul Intenso #1f6feb -->
  <rect x="0.8" y="0.8" width="66.4" height="30.4" rx="15" class="pill-bg" />

  <!-- Leading Icon (16x16) -->
  <g transform="translate(10, 8) scale(0.666)">
    <path fill="#277A9F" d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.15a7.85 7.85 0 110 15.7 7.85 7.85 0 010-15.7z"/>
