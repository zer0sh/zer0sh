<svg xmlns="http://www.w3.org/2000/svg" width="94" height="32" viewBox="0 0 94 32" fill="none" role="img" aria-label="OpenCode">
  <title>OpenCode</title>
  <defs>
    <style>
      .pill-bg {
        fill: #131316;
        stroke: #1f6feb;
        stroke-width: 1.3;
        transition: all 0.2s ease;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e2e5;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Material You Pill: rx="16" para redondeo total + Borde Azul Intenso #1f6feb -->
