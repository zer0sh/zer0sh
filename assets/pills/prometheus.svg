    <path fill="#E6522C" d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm1.09 18.5h-2.18v-4.36h2.18v4.36zm0-6.54h-2.18V5.5h2.18v6.46z"/>
