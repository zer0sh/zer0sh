<svg xmlns="http://www.w3.org/2000/svg" width="108" height="32" viewBox="0 0 108 32" fill="none" role="img" aria-label="Prometheus">
  <title>Prometheus</title>
  <defs>
    <style>
      .pill-bg {
        fill: #131316;
        stroke: #1f6feb;
        stroke-width: 1.3;
        transition: all 0.2s ease;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
